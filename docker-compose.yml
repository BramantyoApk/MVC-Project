services:
  web:
    build: .
    container_name: readview_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: db_absen
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: readview_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: db_absen
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: readview_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: password
    depends_on:
      - db
    restart: always

volumes:
  db_data:
